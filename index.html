<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVERWATCH - Session Console</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        surface: {
                            base: '#09090b',
                            panel: '#18181b',
                            hover: '#27272a',
                            border: '#3f3f46',
                        },
                        brand: {
                            cyan: '#06b6d4',
                            cyan_glow: 'rgba(6, 182, 212, 0.15)',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            red: '#ef4444',
                            amber: '#f59e0b',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

        .glass-panel {
            background: rgba(24, 24, 27, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .data-value-glow { text-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .cursor-blink { animation: blink 1s step-end infinite; }
        
        .scanline-bg {
            background-image: radial-gradient(rgba(63, 63, 70, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>

<body class="bg-surface-base text-zinc-400 h-screen overflow-hidden selection:bg-brand-cyan selection:text-white flex flex-col relative">
    
    <div class="absolute inset-0 z-0 pointer-events-none scanline-bg"></div>

    <div class="relative z-10 flex h-full flex-col w-full">
        <header class="h-16 shrink-0 border-b border-surface-border bg-surface-base/85 backdrop-blur-sm px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-6 min-w-0">
                <div class="flex items-center gap-3 shrink-0">
                    <div class="w-2 h-2 bg-brand-cyan rounded-full animate-pulse shadow-[0_0_8px_#06b6d4]"></div>
                    <h1 class="text-zinc-100 font-semibold tracking-wide text-sm m-0">
                        OVERWATCH
                    </h1>
                </div>

                <div class="hidden md:flex items-center gap-5 text-xs font-mono min-w-0">
                    <div class="flex items-center text-zinc-300">
                        <span class="text-zinc-500 mr-2">Target Node:</span>
                        <span id="target-ip" class="text-zinc-100 font-medium tracking-wider"></span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 lg:gap-4 text-xs shrink-0">
                <div class="font-mono text-zinc-400 hidden sm:flex items-center gap-1" id="system-clock">
                    <span id="system-clock-time">00:00:00</span>
                    <span class="text-zinc-600">UTC</span>
                </div>
                <div class="h-4 w-px bg-surface-border hidden sm:block"></div>
            </div>
        </header>

        <main class="flex-1 min-h-0 overflow-hidden p-5 lg:p-6 grid grid-rows-[auto_minmax(0,1fr)] gap-5">
            
            <section class="grid grid-cols-2 xl:grid-cols-4 gap-4 shrink-0">
                <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between min-h-[110px]">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Relay Throughput</h2>
                        <i data-lucide="arrow-down-right" class="w-4 h-4 text-brand-cyan"></i>
                    </div>
                    <div class="flex items-end gap-2">
                        <span class="text-3xl font-light text-zinc-100 font-mono data-value-glow" id="inbound-metric">0.0</span>
                        <span class="text-sm text-zinc-500 mb-1">Gbps</span>
                    </div>
                </div>

                <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between min-h-[110px]">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Active Nodes</h2>
                        <i data-lucide="crosshair" class="w-4 h-4 text-brand-red"></i>
                    </div>
                    <div class="flex items-end gap-2">
                        <span class="text-3xl font-light text-zinc-100 font-mono" id="hosts-metric">1,842</span>
                    </div>
                </div>

                <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between min-h-[110px]">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Outbound Packets</h2>
                        <i data-lucide="database-zap" class="w-4 h-4 text-brand-purple"></i>
                    </div>
                    <div class="flex items-end gap-2">
                        <span class="text-3xl font-light text-zinc-100 font-mono" id="exfil-metric">847</span>
                        <span class="text-sm text-zinc-500 mb-1">GB</span>
                    </div>
                </div>

                <div class="glass-panel p-4 rounded-2xl flex flex-col justify-between min-h-[110px]">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="text-[11px] font-medium text-zinc-500 uppercase tracking-wider m-0">Cipher Drift</h2>
                        <i data-lucide="key" class="w-4 h-4 text-brand-amber"></i>
                    </div>
                    <div class="w-full mt-4">
                        <div class="flex justify-between text-xs mb-1 font-mono">
                            <span class="text-brand-amber">UNWRAPPING...</span>
                            <span class="text-zinc-300" id="cipher-progress-text">72%</span>
                        </div>
                        <div class="w-full bg-surface-base rounded-full h-1 overflow-hidden">
                            <div class="bg-brand-amber h-1 transition-all duration-300 ease-out" id="cipher-progress-bar" style="width: 72%"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="grid grid-cols-1 xl:grid-cols-[minmax(0,1.65fr)_minmax(340px,1fr)] gap-5 min-h-0">
                
                <div class="glass-panel rounded-2xl p-5 flex flex-col min-h-0 overflow-hidden">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <h2 class="text-sm font-medium text-zinc-300 m-0">Packet Trace</h2>
                        <div class="flex gap-4">
                            <span class="flex items-center text-xs text-zinc-500"><div class="w-2 h-2 rounded-full bg-brand-cyan mr-2"></div>AUX</span>
                            <span class="flex items-center text-xs text-zinc-500"><div class="w-2 h-2 rounded-full bg-brand-purple mr-2"></div>RAW</span>
                        </div>
                    </div>
                    <div class="relative flex-1 min-h-0 w-full">
                        <canvas id="telemetryChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl p-5 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <div class="flex items-center gap-2.5">
                            <i data-lucide="terminal" class="w-4 h-4 text-zinc-400"></i>
                            <h2 class="text-sm font-medium text-zinc-300 m-0">Shell Console</h2>
                        </div>
                        <span class="flex items-center gap-1.5 text-[10px] font-mono text-brand-green bg-brand-green/10 px-2 py-1 rounded border border-brand-green/20">
                            <div class="w-1.5 h-1.5 rounded-full bg-brand-green animate-pulse"></div>
                            CONNECTED
                        </span>
                    </div>

                    <div class="flex-1 min-h-0 bg-black/40 rounded-xl border border-white/5 p-4 font-mono text-[12px] leading-relaxed overflow-hidden flex flex-col relative shadow-inner">
                        <div class="flex-1 min-h-0 relative overflow-hidden">
                            <div id="terminal-log-container" class="absolute bottom-0 left-0 right-0 flex flex-col justify-end"></div>
                        </div>
                        <div class="mt-3 flex items-center gap-2 text-zinc-400 shrink-0 border-t border-white/5 pt-2">
                            <span class="text-brand-cyan font-medium">root@overwatch</span>
                            <span class="text-zinc-600">~ $</span>
                            <span class="cursor-blink w-2 h-3.5 bg-zinc-400 inline-block align-middle"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        class Utils {
            static targetIP = '';

            static generateRandomIP() {
                const first = Math.floor(Math.random() * 223) + 1;
                const rest = Array.from({ length: 3 }, () => Math.floor(Math.random() * 256));
                return [first, ...rest].join('.');
            }

            static randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            static clamp(value, min, max) {
                return Math.min(max, Math.max(min, value));
            }

            static getUTCTimeString() {
                return new Date().toISOString().substring(11, 19);
            }

            static generateHex(length) {
                let result = '';
                const chars = '0123456789abcdef';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }
        }

        class SystemHeader {
            constructor() {
                this.ipElement = document.getElementById('target-ip');
                this.clockElement = document.getElementById('system-clock-time');
                this.init();
            }

            init() {
                Utils.targetIP = Utils.generateRandomIP();
                this.ipElement.textContent = Utils.targetIP;
                
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
            }

            updateClock() {
                this.clockElement.textContent = Utils.getUTCTimeString();
            }
        }

        class SystemMetrics {
            constructor() {
                this.elements = {
                    inbound: document.getElementById('inbound-metric'),
                    hosts: document.getElementById('hosts-metric'),
                    exfil: document.getElementById('exfil-metric'),
                    cipherBar: document.getElementById('cipher-progress-bar'),
                    cipherText: document.getElementById('cipher-progress-text')
                };
                
                this.elements.inbound.textContent = '42.8';
                this.startSimulation();
            }

            startSimulation() {
                setInterval(() => this.updateMetrics(), 1000);
            }

            updateMetrics() {
                if (Math.random() > 0.45) {
                    const newValue = Utils.randomInRange(38, 48);
                    this.elements.inbound.textContent = newValue.toFixed(1);
                }

                if (Math.random() > 0.7) {
                    const current = parseInt(this.elements.hosts.textContent.replace(/,/g, ''), 10);
                    const increment = Math.floor(Math.random() * 4);
                    this.elements.hosts.textContent = (current + increment).toLocaleString();
                }

                if (Math.random() > 0.8) {
                    const current = parseInt(this.elements.exfil.textContent, 10);
                    this.elements.exfil.textContent = (current + 1).toString();
                }

                if (Math.random() > 0.9) {
                    const currentPct = parseInt(this.elements.cipherText.textContent, 10);
                    let nextPct = currentPct + (Math.random() > 0.5 ? 1 : -1);
                    nextPct = Utils.clamp(nextPct, 65, 85);
                    
                    this.elements.cipherText.textContent = `${nextPct}%`;
                    this.elements.cipherBar.style.width = `${nextPct}%`;
                }
            }
        }

        class TelemetryChart {
            constructor(canvasId) {
                this.ctx = document.getElementById(canvasId).getContext('2d');
                this.dataPoints = 30;
                this.tcpData = Array.from({ length: this.dataPoints }, () => Utils.randomInRange(20, 75));
                this.udpData = Array.from({ length: this.dataPoints }, () => Utils.randomInRange(10, 45));
                
                this.setupChartDefaults();
                this.initChart();
                this.startSimulation();
            }

            setupChartDefaults() {
                Chart.defaults.color = '#71717a';
                Chart.defaults.font.family = "'Inter', sans-serif";
                Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(24, 24, 27, 0.94)';
                Chart.defaults.plugins.tooltip.titleColor = '#f4f4f5';
                Chart.defaults.plugins.tooltip.bodyColor = '#a1a1aa';
                Chart.defaults.plugins.tooltip.borderColor = '#3f3f46';
                Chart.defaults.plugins.tooltip.borderWidth = 1;
            }

            createGradient(colorStart, colorEnd) {
                const gradient = this.ctx.createLinearGradient(0, 0, 0, 360);
                gradient.addColorStop(0, colorStart);
                gradient.addColorStop(1, colorEnd);
                return gradient;
            }

            initChart() {
                const labels = Array.from({ length: this.dataPoints }, (_, i) => i);
                const gradientAUX = this.createGradient('rgba(6, 182, 212, 0.18)', 'rgba(6, 182, 212, 0)');
                const gradientRAW = this.createGradient('rgba(139, 92, 246, 0.18)', 'rgba(139, 92, 246, 0)');

                this.chart = new Chart(this.ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: 'Relay A (AUX)',
                                data: this.tcpData,
                                borderColor: '#06b6d4',
                                backgroundColor: gradientAUX,
                                borderWidth: 1.25,
                                fill: true,
                                tension: 0.2,
                                pointRadius: 0,
                                pointHitRadius: 10,
                            },
                            {
                                label: 'Relay B (RAW)',
                                data: this.udpData,
                                borderColor: '#8b5cf6',
                                backgroundColor: gradientRAW,
                                borderWidth: 1.25,
                                fill: true,
                                tension: 0.2,
                                pointRadius: 0,
                                pointHitRadius: 10,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 0 },
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { display: false },
                            y: {
                                display: true,
                                position: 'right',
                                grid: { color: 'rgba(63, 63, 70, 0.25)', drawBorder: false },
                                border: { display: false },
                                ticks: { font: { family: "'JetBrains Mono', monospace", size: 10 }, stepSize: 20 }
                            }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }

            startSimulation() {
                setInterval(() => {
                    const tcpSpike = Math.random() > 0.92 ? 22 : 0;
                    const nextTcp = Utils.clamp(this.tcpData[this.tcpData.length - 1] + Utils.randomInRange(-9, 9) + tcpSpike, 8, 95);
                    const nextUdp = Utils.clamp(this.udpData[this.udpData.length - 1] + Utils.randomInRange(-6, 6), 5, 60);

                    this.tcpData.shift(); this.tcpData.push(nextTcp);
                    this.udpData.shift(); this.udpData.push(nextUdp);
                    this.chart.update('none');
                }, 1000);
            }
        }

        class TerminalConsole {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.maxLines = 45; 
                this.lines = [];    
                this.init();
            }

            init() {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < this.maxLines; i++) {
                    const row = this.createRowElement();
                    this.updateRowContent(row, true); 
                    this.lines.push(row);
                    fragment.appendChild(row);
                }
                this.container.appendChild(fragment);
                this.startStreaming();
            }

            createRowElement() {
                const row = document.createElement('div');
                row.className = 'flex gap-3 items-start min-w-0 font-mono text-[11px] leading-tight mb-1.5 opacity-90';
                
                const timeSpan = document.createElement('span');
                timeSpan.className = 'text-zinc-600 shrink-0 whitespace-nowrap time-col';
                
                const tagSpan = document.createElement('span');
                tagSpan.className = 'shrink-0 w-12 tag-col font-medium';
                
                const msgSpan = document.createElement('span');
                msgSpan.className = 'min-w-0 break-words text-zinc-300 msg-col';

                row.appendChild(timeSpan);
                row.appendChild(tagSpan);
                row.appendChild(msgSpan);
                
                return row;
            }

            generateDynamicLog() {
                const target = Utils.targetIP || '127.0.0.1';
                const randomIp = Utils.generateRandomIP();
                const port = [22, 21, 80, 443, 3389, 8080, 5432, 27017][Math.floor(Math.random() * 8)];
                const hex = Utils.generateHex(8);
                const pid = Math.floor(Utils.randomInRange(1000, 9999));
                
                const templates = [
                    { tag: 'SCAN',  color: 'text-brand-cyan',   html: `Initiating Nmap stealth scan against <span class="text-zinc-100">${target}</span>...` },
                    { tag: 'SCAN',  color: 'text-brand-cyan',   html: `Discovered open port <span class="text-brand-cyan">${port}/tcp</span> on ${target}` },
                    { tag: 'SEC',   color: 'text-brand-amber',  html: `Bypassing IPS signatures for node <span class="text-zinc-100">${target}</span>...` },
                    { tag: 'SEC',   color: 'text-brand-red',    html: `Intrusion detection alert ignored on <span class="text-zinc-100">${randomIp}</span>` },
                    { tag: 'EXP',   color: 'text-brand-red',    html: `Injecting payload into process PID <span class="text-zinc-100">${pid}</span>` },
                    { tag: 'EXP',   color: 'text-brand-red',    html: `Exploit triggered at memory offset <span class="text-zinc-400">0x${hex}</span>` },
                    { tag: 'CRYPT', color: 'text-brand-amber',  html: `Brute-forcing AES-256... <span class="text-zinc-500">Hash: ${Utils.generateHex(16)}</span>` },
                    { tag: 'CRYPT', color: 'text-brand-amber',  html: `Decrypted packet fragment: <span class="text-zinc-400">0x${Utils.generateHex(12)}</span>` },
                    { tag: 'NET',   color: 'text-brand-purple', html: `Intercepting traffic routing from <span class="text-zinc-100">${randomIp}</span>` },
                    { tag: 'NET',   color: 'text-brand-purple', html: `Rerouting socket to <span class="text-brand-cyan">${target}:${port}</span>` },
                    { tag: 'SYS',   color: 'text-zinc-400',     html: `Allocating <span class="text-brand-cyan">4096 bytes</span> in <span class="text-zinc-500">0x${Utils.generateHex(8)}</span>` },
                    { tag: 'SYS',   color: 'text-brand-green',  html: `Reverse shell session established with <span class="text-zinc-100">${target}</span>` },
                    { tag: 'DUMP',  color: 'text-zinc-600',     html: `0x${Utils.generateHex(4)}: ${Utils.generateHex(2)} ${Utils.generateHex(2)} ${Utils.generateHex(2)} ${Utils.generateHex(2)} ${Utils.generateHex(2)} ${Utils.generateHex(2)}` }
                ];
                
                return templates[Math.floor(Math.random() * templates.length)];
            }

            updateRowContent(rowElement, isInit = false) {
                const logData = this.generateDynamicLog();
                const timeStr = new Date().toISOString().substring(11, 19);

                const [timeSpan, tagSpan, msgSpan] = rowElement.children;

                if(isInit) {
                     const pastTime = new Date(Date.now() - Math.random() * 600000);
                     timeSpan.textContent = pastTime.toISOString().substring(11, 19);
                } else {
                     timeSpan.textContent = timeStr;
                }
                
                tagSpan.className = `shrink-0 w-12 font-medium ${logData.color}`;
                tagSpan.textContent = `[${logData.tag}]`;
                
                msgSpan.innerHTML = logData.html;
            }

            appendLog() {
                const oldestRow = this.lines.shift();
                this.updateRowContent(oldestRow);
                
                this.lines.push(oldestRow);
                this.container.appendChild(oldestRow);
            }

            startStreaming() {
                const logLoop = () => {
                    this.appendLog();
                    const nextDelay = Utils.randomInRange(200, 1400);
                    setTimeout(logLoop, nextDelay);
                };
                logLoop();
            }
        }

        class DashboardApp {
            static bootstrap() {
                lucide.createIcons();

                new SystemHeader();
                new SystemMetrics();
                
                setTimeout(() => {
                    new TelemetryChart('telemetryChart');
                }, 0);
                
                new TerminalConsole('terminal-log-container');
            }
        }

        document.addEventListener('DOMContentLoaded', DashboardApp.bootstrap);
    </script>
</body>
</html>
